<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<title>Relaciona: Alemany</title>
<style>
body {
  font-family: 'Georgia', serif;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  background: #fff;
  color: #000;
}
h1 {
  color: #003366;
  text-align: center;
}
#tema-selector {
  margin-bottom: 20px;
  background: #f4f8ff;
  padding: 15px;
  border-radius: 8px;
  border-left: 4px solid #003366;
}
#tema-selector select {
  padding: 6px;
  font-size: 14px;
  border: 1px solid #ccc;
  border-radius: 4px;
}
.match-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2em;
  padding: 20px 0;
  min-height: 400px;
  position: relative;
}
.match-lines {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.col {
  display: flex;
  flex-direction: column;
}
.col h3 {
  text-align: center;
  color: #003366;
  border-bottom: 2px solid #003366;
  padding-bottom: 8px;
  margin-bottom: 15px;
}
.item {
  padding: 12px;
  border: 1px solid #ccc;
  margin-bottom: 8px;
  cursor: pointer;
  user-select: none;
  transition: background-color 0.2s ease, border 0.2s ease;
  background-color: #fff;
  border-radius: 4px;
  font-size: 16px;
}
.item:hover {
  background-color: #f0f8ff;
}
.selected {
  background-color: #d0ebff;
  border: 2px solid #003366;
}
.matched {
  border: 2px solid green;
  background-color: #e8fbe8;
}
.fixed-german {
  border: 2px solid orange;
  background-color: #fffacc !important;
}
.fixed-cat {
  border: 2px solid orange;
  background-color: #fffacc !important;
  pointer-events: none;
}
.incorrect-german, .incorrect-cat {
  border: 2px solid red;
  background-color: #ffeaea !important;
}
#score {
  font-weight: bold;
  margin-top: 1em;
  color: #003366;
  font-size: 18px;
  text-align: center;
  padding: 10px;
  background: #f4f8ff;
  border-radius: 8px;
}
#controls {
  margin-top: 2em;
  text-align: center;
}
#controls button {
  margin: 5px 5px 15px 0;
  padding: 10px 18px;
  font-size: 16px;
  background-color: #003366;
  color: #fff;
  border: none;
  cursor: pointer;
  border-radius: 4px;
  transition: background-color 0.3s;
}
#controls button:hover {
  background-color: #005599;
}
.nota {
  margin-top: 30px;
  padding: 15px;
  background: #f4f8ff;
  border-left: 4px solid #003366;
  font-size: 14px;
  border-radius: 0 8px 8px 0;
}
.pronuncia {
  font-size: 12px;
  color: #666;
  font-style: italic;
  margin-top: 4px;
}
</style>
</head>
<body>

<h1>🇩🇪 Relaciona en alemany</h1>

  <!-- Pots triar: center (per defecte), left o right -->
<div class="image left">
  <img src="Alemanya.jpg" alt="Alemanya">
</div> 
  
<div id="tema-selector">
  <label for="tema">Tria un tema: </label>
  <select id="tema">
    <option value="colors">Colors</option>
    <option value="fruites">Fruites</option>
    <option value="animals">Animals</option>
    <option value="cortesia">Frases de cortesia</option>
    <option value="dies">Dies de la setmana</option>
    <option value="numeros">Números (1-10)</option>
    <option value="cos">Parts del cos</option>
    <option value="familia">Família</option>
    <option value="verb_ser">Verb ser (sein)</option>
    <option value="pronoms">Pronoms personals</option>
    <option value="paisatge">Paisatge i natura</option>
    <option value="transport">Transport</option>
    <option value="menjar">Menjar i begudes</option>
    <option value="temps">Temps atmosfèric</option>
    <option value="ciutat">Ciutat i serveis</option>
    <option value="verb_tenir">Verb tenir (haben)</option>
    <option value="adjectius">Adjectius bàsics</option>
    <option value="interrogatius">Paraules interrogatives</option>
  </select>
  <button onclick="canviaTema()">✅ Carrega tema</button>
</div>

  
<p>Fes clic a una paraula en <strong>alemany</strong> i després a la traducció en català.<br></p>
<p><strong>Verd</strong> = encert a la primera | <strong>Groc</strong> = encert després d'errors (es repetirà a la següent ronda) | <strong>Vermell</strong> = error.<br></p>

<div class="match-container">
  <svg class="match-lines"></svg>

  <div class="col">
    <h3>Alemany</h3>
    <div id="alemany"></div>
  </div>

  <div class="col">
    <h3>Català</h3>
    <div id="catala"></div>
  </div>
</div>

<div id="score">Encerts: 0 / 10</div>

<div id="controls">
  <button onclick="novaRonda()">🔁 Torna a començar</button>

</div>

let paraulesActuals = TEMES.colors;
let encerts = 0;
let selectedGerman = null;
let currentAttempts = {};

function canviaTema() {
  paraulesActuals = TEMES[document.getElementById("tema").value];
  novaRonda();
}

function barreja(array) {
  return array.slice().sort(() => Math.random() - 0.5);
}

function speakGerman(text) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "de-DE";
  utterance.rate = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}

function pronunciaSeleccionat() {
  if (selectedGerman) {
    const text = selectedGerman.querySelector("div")?.textContent || selectedGerman.textContent;
    speakGerman(text);
  } else {
    alert("Selecciona primer una paraula en alemany");
  }
}

function actualitzaPuntuacio() {
  document.getElementById("score").textContent = `Encerts: ${encerts} / ${TOTAL_PER_RONDA}`;
}

function novaRonda() {
  const grogues = [];
  document.querySelectorAll(".fixed-german").forEach(el => {
    grogues.push(parseInt(el.dataset.id));
  });

  const restants = paraulesActuals.filter(f => !grogues.includes(f.id));
  const seleccionades = [];

  grogues.forEach(id => {
    const paraula = paraulesActuals.find(f => f.id === id);
    if (paraula) seleccionades.push(paraula);
  });

  const addicionals = barreja(restants).slice(0, TOTAL_PER_RONDA - seleccionades.length);
  seleccionades.push(...addicionals);

  currentAttempts = {};
  generaExercici(seleccionades);
  dibuixaLinies();
}

function netejaErrors() {
  document.querySelectorAll(".incorrect-german, .incorrect-cat").forEach(el => {
    el.classList.remove("incorrect-german", "incorrect-cat");
  });
}

function mouAlTop(element) {
  const parent = element.parentNode;
  parent.insertBefore(element, parent.firstChild);
}

function dibuixaLinies() {
  const svg = document.querySelector(".match-lines");
  svg.innerHTML = "";
  const alemanyContainer = document.getElementById("alemany");
  const catContainer = document.getElementById("catala");

  const matchedGerman = alemanyContainer.querySelectorAll(".matched, .fixed-german");
  matchedGerman.forEach(german => {
    const germanId = german.dataset.id;
    const cat = catContainer.querySelector(`.matched[data-id="${germanId}"], .fixed-cat[data-id="${germanId}"]`);
    if (cat) {
      const germanRect = german.getBoundingClientRect();
      const catRect = cat.getBoundingClientRect();
      const containerRect = svg.getBoundingClientRect();

      const x1 = germanRect.right - containerRect.left;
      const y1 = germanRect.top + germanRect.height / 2 - containerRect.top;
      const x2 = catRect.left - containerRect.left;
      const y2 = catRect.top + catRect.height / 2 - containerRect.top;

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x1);
      line.setAttribute("y1", y1);
      line.setAttribute("x2", x2);
      line.setAttribute("y2", y2);
      line.setAttribute("stroke", "#003366");
      line.setAttribute("stroke-width", "2");
      line.setAttribute("stroke-dasharray", "5,3");
      svg.appendChild(line);
    }
  });
}

function generaExercici(frases) {
  const alemanyContainer = document.getElementById("alemany");
  const catContainer = document.getElementById("catala");
  alemanyContainer.innerHTML = "";
  catContainer.innerHTML = "";
  encerts = 0;
  selectedGerman = null;
  actualitzaPuntuacio();

  const alemanyFrases = barreja(frases);
  const catFrases = barreja(frases);

  alemanyFrases.forEach(f => {
    const div = document.createElement("div");
    div.className = "item";
    div.dataset.id = f.id;

    const textDiv = document.createElement("div");
    textDiv.textContent = f.german;

    const pronDiv = document.createElement("div");
    pronDiv.className = "pronuncia";
    pronDiv.textContent = `Pronúncia (aprox.): ${f.pron}`;

    div.appendChild(textDiv);
    div.appendChild(pronDiv);

    div.addEventListener("click", () => {
      speakGerman(f.german);
      if (div.classList.contains("matched") || div.classList.contains("fixed-german")) return;
      netejaErrors();
      document.querySelectorAll("#alemany .item").forEach(el => el.classList.remove("selected"));
      div.classList.add("selected");
      selectedGerman = div;
    });

    alemanyContainer.appendChild(div);
  });

  catFrases.forEach(f => {
    const div = document.createElement("div");
    div.className = "item";
    div.dataset.id = f.id;
    div.textContent = f.cat;

    div.addEventListener("click", () => {
      if (!selectedGerman) return;
      if (div.classList.contains("matched") || div.classList.contains("fixed-cat")) return;

      const germanId = selectedGerman.dataset.id;
      const catId = div.dataset.id;

      if (germanId === catId) {
        if (currentAttempts[germanId] && currentAttempts[germanId].attempts > 0) {
          selectedGerman.classList.add("fixed-german");
          div.classList.add("fixed-cat");
        } else {
          selectedGerman.classList.add("matched");
          div.classList.add("matched");
          encerts++;
          actualitzaPuntuacio();
        }
        mouAlTop(selectedGerman);
        mouAlTop(div);
        dibuixaLinies();
      } else {
        selectedGerman.classList.add("incorrect-german");
        div.classList.add("incorrect-cat");
        if (!currentAttempts[germanId]) currentAttempts[germanId] = { attempts: 0 };
        currentAttempts[germanId].attempts++;
      }

      selectedGerman.classList.remove("selected");
      selectedGerman = null;
    });

    catContainer.appendChild(div);
  });
}

window.addEventListener("resize", dibuixaLinies);
window.onload = () => canviaTema();
</script>
